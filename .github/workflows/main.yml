name: Foodgram CI

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build backend image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          push: false
          tags: foodgram_backend:test

  push-to-registry:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Yandex Container Registry
        id: login
        uses: docker/login-action@v3
        with:
          registry: cr.yandex
          username: json_key
          password: ${{ secrets.YC_SA_JSON_CREDENTIALS }}
        continue-on-error: true

      - name: Skip push hint
        if: steps.login.outcome != 'success'
        run: |
          echo "::warning::Добавьте секреты YC_SA_JSON_CREDENTIALS и YC_REGISTRY_ID для push в registry"
          echo "Сайт можно поднять на ВМ без JSON: docker compose up --build"

      - name: Build and push backend image
        if: steps.login.outcome == 'success'
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          push: true
          tags: |
            cr.yandex/${{ secrets.YC_REGISTRY_ID }}/foodgram_backend:latest
            cr.yandex/${{ secrets.YC_REGISTRY_ID }}/foodgram_backend:${{ github.sha }}
