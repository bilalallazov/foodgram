name: Foodgram Deploy

on:
  workflow_run:
    workflows: [Foodgram CI]
    types:
      - completed
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    concurrency:
      group: foodgram-deploy-production
      cancel-in-progress: true
    if: >
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'
    steps:
      - uses: actions/checkout@v4

      - name: Check SSH secrets
        run: |
          test -n "${{ secrets.HOST }}" || (echo "::error::Добавьте секрет HOST (IP ВМ)" && exit 1)
          test -n "${{ secrets.USER }}" || (echo "::error::Добавьте секрет USER (ubuntu)" && exit 1)
          test -n "${{ secrets.SSH_PRIVATE_KEY }}" || (echo "::error::Добавьте секрет SSH_PRIVATE_KEY" && exit 1)

      - name: Create deploy archive
        shell: bash
        run: |
          set -e
          BUNDLE="${RUNNER_TEMP}/foodgram-bundle"
          ARCHIVE="${GITHUB_WORKSPACE}/foodgram.tar.gz"
          rm -rf "$BUNDLE" "$ARCHIVE"
          mkdir -p "$BUNDLE"
          cp -r backend frontend infra docs data postman_collection "$BUNDLE/"
          cp tests.yml setup.cfg README.md LICENSE "$BUNDLE/" 2>/dev/null || true
          cp .gitignore "$BUNDLE/" 2>/dev/null || true
          tar -czf "$ARCHIVE" -C "$BUNDLE" .
          ls -lh "$ARCHIVE"

      - name: Upload archive to server
        uses: appleboy/scp-action@v1.0.0
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          source: foodgram.tar.gz
          target: /tmp/foodgram_deploy.tar.gz
          overwrite: true

      - name: Deploy on server
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          command_timeout: 30m
          script_stop: true
          script: |
            set -e
            if ! docker compose version >/dev/null 2>&1; then
              echo "Install Docker Compose v2 (docker compose plugin)"
              exit 1
            fi
            COMPOSE="docker compose"

            for ARCHIVE in /tmp/foodgram_deploy.tar.gz /tmp/foodgram.tar.gz /tmp/foodgram.tar.gz/foodgram.tar.gz; do
              if [ -f "$ARCHIVE" ]; then
                break
              fi
            done
            test -f "$ARCHIVE" || (echo "Archive not found in /tmp" && ls -la /tmp && exit 1)

            mkdir -p "$HOME/foodgram"
            if [ -f "$HOME/foodgram/infra/.env" ]; then
              cp "$HOME/foodgram/infra/.env" /tmp/foodgram.env.bak
            fi
            tar xzf "$ARCHIVE" -C "$HOME/foodgram"
            if [ -f /tmp/foodgram.env.bak ]; then
              cp /tmp/foodgram.env.bak "$HOME/foodgram/infra/.env"
            elif [ ! -f "$HOME/foodgram/infra/.env" ]; then
              cp "$HOME/foodgram/infra/.env.production.example" "$HOME/foodgram/infra/.env"
            fi
            sed -i 's/\r$//' "$HOME/foodgram/backend/entrypoint.sh"
            chmod +x "$HOME/foodgram/backend/entrypoint.sh"
            mkdir -p "$HOME/foodgram/backend/data"
            test -f "$HOME/foodgram/backend/data/ingredients.csv" || \
              cp "$HOME/foodgram/data/ingredients.csv" "$HOME/foodgram/backend/data/" 2>/dev/null || true
            cd "$HOME/foodgram/infra"
            sed -i "s/ALLOWED_HOSTS=.*/ALLOWED_HOSTS=${{ secrets.HOST }},127.0.0.1,localhost,backend/" .env

            $COMPOSE -f docker-compose.yml down --remove-orphans --timeout 30 || true
            for name in foodgram-db foodgram-backend foodgram-front foodgram-proxy; do
              docker rm -f "$name" 2>/dev/null || true
            done
            docker ps -a --format '{{.Names}}' | grep -E 'foodgram' | xargs -r docker rm -f || true
            $COMPOSE -f docker-compose.yml up -d --build --force-recreate --remove-orphans
            sleep 15

            docker run --rm -v "$HOME/foodgram/frontend/build:/out" alpine \
              sh -c 'rm -rf /out/* /out/.[!.]* 2>/dev/null || true'
            docker run --rm -v "$HOME/foodgram/frontend/build:/out" infra-frontend \
              sh -c 'cp -r /app/build/. /out/' || \
            docker run --rm -v "$HOME/foodgram/frontend/build:/out" infra_frontend \
              sh -c 'cp -r /app/build/. /out/'

            $COMPOSE -f docker-compose.yml restart nginx
            $COMPOSE -f docker-compose.yml ps
