name: Foodgram Deploy

on:
  workflow_run:
    workflows: [Foodgram CI]
    types:
      - completed
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    if: >
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'
    steps:
      - name: Check SSH secrets
        run: |
          test -n "${{ secrets.HOST }}" || (echo "::error::Добавьте секрет HOST (IP ВМ)" && exit 1)
          test -n "${{ secrets.USER }}" || (echo "::error::Добавьте секрет USER (ubuntu)" && exit 1)
          test -n "${{ secrets.SSH_PRIVATE_KEY }}" || (echo "::error::Добавьте секрет SSH_PRIVATE_KEY" && exit 1)

      - name: Deploy to server
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script_stop: true
          script: |
            set -e
            if [ ! -d "$HOME/foodgram" ]; then
              git clone https://github.com/bilalallazov/foodgram.git "$HOME/foodgram"
            fi
            cd "$HOME/foodgram"
            git pull origin main
            mkdir -p backend/data
            test -f backend/data/ingredients.csv || cp data/ingredients.csv backend/data/
            sed -i 's/\r$//' backend/entrypoint.sh
            chmod +x backend/entrypoint.sh
            cd infra
            if [ ! -f .env ]; then
              cp .env.production.example .env
              sed -i "s/your-server-ip/${{ secrets.HOST }}/" .env
            fi
            grep -q "${{ secrets.HOST }}" .env || sed -i "s/ALLOWED_HOSTS=.*/ALLOWED_HOSTS=${{ secrets.HOST }},127.0.0.1,localhost,backend/" .env
            docker-compose down --remove-orphans || true
            docker-compose up -d --build
            sleep 20
            if [ -f ../frontend/build/build/index.html ]; then
              cp -r ../frontend/build/build/. ../frontend/build/
            fi
            docker restart foodgram-proxy || docker-compose restart nginx
            docker-compose ps
